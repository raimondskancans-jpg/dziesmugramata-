sti dziesmas akordus, izpildītājus, gadu vai citas piezīmes..."></textarea>
      </div>

      <button id="saveBtn" class="save-btn" onclick="saveSongData()">Saglabāt izmaiņas 💾</button>

      <hr class="divider">

      <div class="author-section">
        Grāmatu izveidoja un dziesmas izvēlējās
        <span class="author-name">Raimonds Kancāns</span>
        <span class="year">2026</span>
      </div>
    </div>

    <!-- ================= 5. EKRĀNS ================= -->
    <div id="page5">
      <div class="top-bar">
        <span class="nav-words" onclick="showPage(4)">⬅ Atpakaļ uz dziesmu</span>
        <h3 id="lyricsHeaderTitle" style="font-size: 0.95rem; font-weight: 700;">Vārdi</h3>
      </div>

      <div class="lyrics-full-container">
        <div id="lyricsText" class="lyrics-text"></div>
        <textarea id="lyricsEditor" class="lyrics-editor" placeholder="Ieraksti vai ielīmē dziesmas tekstus šeit..."></textarea>
      </div>

      <button id="saveBtnLyrics" class="save-btn" onclick="saveSongData()">Saglabāt izmaiņas 💾</button>

      <hr class="divider">

      <div class="author-section">
        Grāmatu izveidoja un dziesmas izvēlējās
        <span class="author-name">Raimonds Kancāns</span>
        <span class="year">2026</span>
      </div>
    </div>

  </div>

  <script>
    let currentSongId = '001';
    let isEditMode = false;

    const defaultSongsList = [
      { id: '001', title: 'Vēl tu rozes plūc nenotvīkdama' },
      { id: '002', title: 'Gaujas laivinieks' },
      { id: '003', title: 'Vecpiebalgas ūdensrozes' },
      { id: '004', title: 'Dažu skaistu ziedu' },
      { id: '005', title: 'Vēstule no Sorento' }
    ];

    /* IK MĒNEŠA TAUTASDZIESMU DATUBĀZE (12 MĒNEŠI) */
    const monthlyFolkDatabase = {
      0: { name: "Janvāris ❄️", text: "Soli pa solim, sniegs kur visapkārt,\nDziedātāji pulcējas siltai dziesmai.\nZiemas aukstumā sirds lai silst,\nDziesmā kļūstot atkal jauns." },
      1: { name: "Februāris 🌨️", text: "Vēja pūsma logā klauvē,\nSveču gaisma istabā;\nSanākāt, bāleliņi,\nSildīsimies dziesmiņā!" },
      2: { name: "Marts 🌿", text: "Pavasaris tālē sauc,\nSniegi kūst un strauti tek;\nCīrulis jau gaisā dzied,\nDziesmu sirdī modinot." },
      3: { name: "Aprīlis 🌸", text: "Lieldieniņas atnākušas,\nLieli prieki bērniņiem;\nŠūposimies augsti gaisā,\nLai aug lini garumā!" },
      4: { name: "Maijs 🍃", text: "Ziedējiņi, plaukumiņi,\nVisa zeme zaļumā;\nMeitas dzied un puiši spēlē\nPavasara vakarā." },
      5: { name: "Jūnijs ☀️", text: "Visa laba jāņu zāle,\nKo par Jāņu nakti plūca;\nVisas bij zelta puķes,\nKas ziedēja pļaviņā." },
      6: { name: "Jūlijs 🌾", text: "Šalc zaļais mežs, dzied meitenes,\nSiena laiks pie vārtiem klauvē;\nViegli un viegli saulīte tek\nPār zaļo ozoliņu." },
      7: { name: "Augusts 🌻", text: "Dziedat, meitas, ko dziedat,\nDziedat skaisti parastā!\nLai skan meži, lai skan lauki,\nLai skan visa tēvu zeme!" },
      8: { name: "Septembris 🍁", text: "Rudens nāk, lapas krīt,\nDzērves kliedz padebešos;\nBet mēs paši savā sētā\nSiltu dziesmu uzdziedam." },
      9: { name: "Oktobris 🍂", text: "Mārtiņdiena klāt ir atkal,\nGailis dzied uz žoga malas;\nSaimnieks ver klēts durtiņas,\nLabi darbi pabeigti." },
      10: { name: "Novembris 🕯️", text: "Sveču gaisma, klusi meži,\nTēvuzemei dziesma skan;\nCaur tumšāko laika posmu\nMūsu sirdis gaismu nes." },
      11: { name: "Decembris 🎄", text: "Ziemassvētki sabraukuši\nRastās kamanās;\nAtnesuši prieku, mieru,\nZelta dziesmu istabā." }
    };

    let savedSongsList = JSON.parse(localStorage.getItem('mySongBookList')) || defaultSongsList;
    let songsData = JSON.parse(localStorage.getItem('mySongBookData')) || {};

    /* SINHRONIZĀCIJA AR INTERNETU UN MĒNEŠA TAUTASDZIESMU ATJAUNINĀŠANA */
    function updateMonthlyFolkSong() {
      const monthIndex = new Date().getMonth();
      const currentMonthFolk = monthlyFolkDatabase[monthIndex];

      document.getElementById('folkHeader').innerText = `☀️ ${currentMonthFolk.name}`;
      document.getElementById('folkText').innerText = currentMonthFolk.text;

      // Pārbauda tīkla savienojumu fona atjaunināšanai
      if (navigator.onLine) {
        fetch('https://httpbin.org/get')
          .then(() => {
            // Tīkls ir aktīvs; šeit automātiski var saņemt atjauninājumus no ārējā servera
          })
          .catch(() => {});
      }
    }

    function triggerVibrate() {
      if (navigator.vibrate) navigator.vibrate(60);
    }

    function setupHoldHandler(elemId, triggerCallback) {
      const elem = document.getElementById(elemId);
      if (!elem) return;
      let timer = null;

      elem.addEventListener('contextmenu', (e) => { e.preventDefault(); return false; });

      const startHold = () => {
        triggerVibrate();
        timer = setTimeout(() => {
          triggerVibrate();
          triggerCallback();
        }, 5000);
      };

      const cancelHold = () => { if (timer) clearTimeout(timer); };

      elem.addEventListener('mousedown', startHold);
      elem.addEventListener('mouseup', cancelHold);
      elem.addEventListener('mouseleave', cancelHold);
      elem.addEventListener('touchstart', startHold, {passive: true});
      elem.addEventListener('touchend', cancelHold);
      elem.addEventListener('touchcancel', cancelHold);
    }

    setupHoldHandler('avatarBtnHolder', () => {
      document.getElementById('avatarFileInput').click();
    });

    setupHoldHandler('headerLockBtn', () => {
      addNewSongOnly();
    });

    setupHoldHandler('songLockBtn', () => {
      if (isEditMode) lockEditingView();
      else unlockEditingView();
    });

    function addNewSongOnly() {
      let defaultId = getNextAvailableId();
      const numInput = prompt("Ievadi jaunās dziesmas NUMURU:", defaultId);
      if (!numInput || numInput.trim() === "") return;

      const numTrimmed = numInput.trim();
      if (savedSongsList.some(s => s.id === numTrimmed)) {
        alert(`❌ Kļūda: Dziesmas numurs #${numTrimmed} jau pastāv!`);
        return;
      }

      const titleInput = prompt(`Ievadi dziesmas NOSAUKUMU numuram #${numTrimmed}:`);
      if (!titleInput || titleInput.trim() === "") return;

      const titleTrimmed = titleInput.trim();
      const duplicateSong = savedSongsList.find(s => s.title.toLowerCase() === titleTrimmed.toLowerCase());
      
      if (duplicateSong) {
        alert(`❌ Dziesma ar nosaukumu "${titleTrimmed}" jau ir sarakstā zem numura #${duplicateSong.id}!`);
        return;
      }

      savedSongsList.push({ id: numTrimmed, title: titleTrimmed });
      if (!songsData[numTrimmed]) {
        songsData[numTrimmed] = { lyrics: '', yt: '', sp: '', kr: '', history: '' };
      }

      saveAllToLocalStorage();
      renderSongList();
      alert(`✅ Dziesma "${titleTrimmed}" (#${numTrimmed}) veiksmīgi pievienota!`);
    }

    function openRandomSong() {
      if (savedSongsList.length === 0) return;
      const randomIndex = Math.floor(Math.random() * savedSongsList.length);
      const song = savedSongsList[randomIndex];
      openSong(song.id, song.title);
    }

    function uploadAvatar(event) {
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById('userAvatarImg').src = reader.result;
        try {
          localStorage.setItem('myUserAvatar', reader.result);
        } catch(e) {
          alert("Atmiņa pilna, nevar saglabāt profilu.");
        }
      };
      if (event.target.files && event.target.files[0]) {
        reader.readAsDataURL(event.target.files[0]);
      }
    }

    function renderSongList() {
      const listContainer = document.getElementById('songList');
      listContainer.innerHTML = '';
      savedSongsList.sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric: true}));

      savedSongsList.forEach(song => {
        const li = document.createElement('li');
        li.className = 'song-item';
        li.setAttribute('data-id', song.id);
        li.setAttribute('data-title', song.title.toLowerCase());
        const historyText = (songsData[song.id] && songsData[song.id].history) ? songsData[song.id].history.toLowerCase() : '';
        li.setAttribute('data-history', historyText);

        li.setAttribute('onclick', `openSong('${song.id}', '${song.title.replace(/'/g, "\\'")}')`);
        li.innerHTML = `
          <span class="song-number">${song.id}</span>
          <span class="song-title">${song.title}</span>
        `;
        listContainer.appendChild(li);
      });
    }

    function getNextAvailableId() {
      let maxId = 0;
      savedSongsList.forEach(s => {
        const num = parseInt(s.id, 10);
        if (!isNaN(num) && num > maxId) maxId = num;
      });
      return String(maxId + 1).padStart(3, '0');
    }

    function showPage(pageNumber) {
      for (let i = 1; i <= 5; i++) {
        document.getElementById('page' + i).style.display = 'none';
      }
      const target = document.getElementById('page' + pageNumber);
      if (pageNumber === 2) updateMonthlyFolkSong();
      target.style.display = 'flex';
    }

    function openSong(num, title) {
      currentSongId = num;
      document.getElementById('currentSongTitle').innerText = num + ". " + title;
      document.getElementById('lyricsHeaderTitle').innerText = num + ". " + title;
      document.getElementById('editNumInput').value = num;
      document.getElementById('editTitleInput').value = title;

      lockEditingView();

      const song = songsData[num] || { lyrics: '', yt: '', sp: '', kr: '', history: '' };
      
      document.getElementById('lyricsText').innerText = song.lyrics || "Teksts vēl nav pievienots.";
      document.getElementById('lyricsEditor').value = song.lyrics || "";

      document.getElementById('songHistoryDisplay').innerText = song.history || "Nav pievienotas norādes vai akordi.";
      document.getElementById('songHistoryEditor').value = song.history || "";

      document.getElementById('ytUrlInput').value = song.yt || "";
      document.getElementById('spUrlInput').value = song.sp || "";
      document.getElementById('krUrlInput').value = song.kr || "";

      showPage(4);
    }

    function unlockEditingView() {
      isEditMode = true;
      document.getElementById('currentSongTitle').style.display = 'none';
      document.getElementById('editTitleBox').style.display = 'flex';
      document.getElementById('saveBtn').style.display = 'block';
      document.getElementById('saveBtnLyrics').style.display = 'block';

      document.getElementById('songHistoryDisplay').style.display = 'none';
      document.getElementById('songHistoryEditor').style.display = 'block';

      document.querySelectorAll('.platform-input').forEach(i => i.style.display = 'block');
      document.getElementById('lyricsText').style.display = 'none';
      document.getElementById('lyricsEditor').style.display = 'block';

      document.getElementById('songLockBtn').innerText = '🔓';
    }

    function lockEditingView() {
      isEditMode = false;
      document.getElementById('currentSongTitle').style.display = 'block';
      document.getElementById('editTitleBox').style.display = 'none';
      document.getElementById('saveBtn').style.display = 'none';
      document.getElementById('saveBtnLyrics').style.display = 'none';

      document.getElementById('songHistoryDisplay').style.display = 'block';
      document.getElementById('songHistoryEditor').style.display = 'none';

      document.querySelectorAll('.platform-input').forEach(i => i.style.display = 'none');
      document.getElementById('lyricsText').style.display = 'block';
      document.getElementById('lyricsEditor').style.display = 'none';

      document.getElementById('songLockBtn').innerText = '🔒';
    }

    function saveAllToLocalStorage() {
      try {
        localStorage.setItem('mySongBookList', JSON.stringify(savedSongsList));
        localStorage.setItem('mySongBookData', JSON.stringify(songsData));
      } catch(e) {
        alert("⚠️ Uzmanību! Pārlūka atmiņa ir pilna.");
      }
    }

    function saveSongData() {
      const newNum = document.getElementById('editNumInput').value.trim();
      const newTitle = document.getElementById('editTitleInput').value.trim();
      const lyricsVal = document.getElementById('lyricsEditor').value;
      const historyVal = document.getElementById('songHistoryEditor').value;
      const ytVal = document.getElementById('ytUrlInput').value.trim();
      const spVal = document.getElementById('spUrlInput').value.trim();
      const krVal = document.getElementById('krUrlInput').value.trim();

      if (!newNum || !newTitle) { alert("Numurs un nosaukums nevar būt tukšs!"); return; }

      const songItem = savedSongsList.find(s => s.id === currentSongId);
      if (songItem) { songItem.id = newNum; songItem.title = newTitle; }

      if (currentSongId !== newNum) delete songsData[currentSongId];

      currentSongId = newNum;
      songsData[currentSongId] = { lyrics: lyricsVal, yt: ytVal, sp: spVal, kr: krVal, history: historyVal };

      saveAllToLocalStorage();

      document.getElementById('currentSongTitle').innerText = currentSongId + ". " + newTitle;
      document.getElementById('lyricsHeaderTitle').innerText = currentSongId + ". " + newTitle;
      document.getElementById('lyricsText').innerText = lyricsVal || "Teksts vēl nav pievienots.";
      document.getElementById('songHistoryDisplay').innerText = historyVal || "Nav pievienotas norādes vai akordi.";

      renderSongList();
      lockEditingView();
      alert("✅ Izmaiņas veiksmīgi saglabātas!");
    }

    function playOrSearch(platformType) {
      let savedUrl = "";
      if (platformType === 'yt') savedUrl = document.getElementById('ytUrlInput').value.trim();
      if (platformType === 'sp') savedUrl = document.getElementById('spUrlInput').value.trim();
      if (platformType === 'kr') savedUrl = document.getElementById('krUrlInput').value.trim();

      if (savedUrl !== "") {
        let finalUrl = savedUrl;
        if (!/^https?:\/\//i.test(finalUrl)) finalUrl = 'https://' + finalUrl;
        window.open(finalUrl, '_blank');
      } else {
        const fullTitle = document.getElementById('currentSongTitle').innerText;
        const songTitle = fullTitle.replace(/^\d+\.\s*/, '').trim();
        const encodedQuery = encodeURIComponent(songTitle);

        let targetUrl = "";
        if (platformType === 'yt') targetUrl = `https://www.youtube.com/results?search_query=${encodedQuery}`;
        if (platformType === 'sp') targetUrl = `https://open.spotify.com/search/${encodedQuery}`;
        if (platformType === 'kr') targetUrl = `https://www.youtube.com/results?search_query=${encodedQuery}+karaoke`;

        if (targetUrl) window.open(targetUrl, '_blank');
      }
    }

    function filterSongsList() {
      const q = document.getElementById('songSearchInput').value.toLowerCase().trim();
      document.querySelectorAll('#songList .song-item').forEach(item => {
        const title = item.getAttribute('data-title') || '';
        const id = item.getAttribute('data-id') || '';
        const history = item.getAttribute('data-history') || '';

        if (title.includes(q) || id.includes(q) || history.includes(q)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    }

    function filterTag(tagName) {
      document.getElementById('songSearchInput').value = tagName;
      filterSongsList();
    }

    function toggleSearch(elementId) {
      const box = document.getElementById(elementId);
      box.style.display = (box.style.display === 'block') ? 'none' : 'block';
    }

    function showTvInfo() {
      alert("📺 TV Transliācija:\nIeslēdziet tālruņa ekrāna spoguļošanu (Cast / Smart View / Screen Mirroring) un izvēlieties TV ierīci.");
    }

    document.getElementById('geminiMainBtn').addEventListener('click', () => {
      const currentTitles = savedSongsList.map(s => `${s.id}. ${s.title}`).join(", ");
      const promptText = `Tu esi mans personīgais Dziesmu Grāmata asistents. Šeit ir mans dziesmu saraksts: [${currentTitles}]. Palīdzi izvēlēties dziesmas svētkiem!`;
      window.open("https://gemini.google.com/?q=" + encodeURIComponent(promptText), '_blank');
    });

    window.addEventListener('online', updateMonthlyFolkSong);

    window.onload = function() {
      const savedPic = localStorage.getItem('myUserAvatar');
      if (savedPic) document.getElementById('userAvatarImg').src = savedPic;
      updateMonthlyFolkSong();
      renderSongList();
    };
  </script>

</body>
</html>
