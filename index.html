<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dziesmu Grāmata</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header {
      margin-top: 20px;
      margin-bottom: 25px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .search-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 25px;
    }
    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      outline: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      background-color: rgba(255, 255, 255, 0.95);
      color: #333;
    }
    .song-list {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .song-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.2s, background 0.2s;
      cursor: pointer;
    }
    .song-card:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.2);
    }
    .song-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <h1>Dziesmu Grāmata</h1>
  </header>

  <div class="search-container">
    <input type="text" placeholder="Meklēt dziesmu...">
  </div>

  <div class="song-list">
    <div class="song-card">
      <div class="song-title">Piemēra Dziesma 1</div>
    </div>
    <div class="song-card">
      <div class="song-title">Piemēra Dziesma 2</div>
    </div>
  </div>

</body>
</html>
